<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica,Arial,sans-serif">
<rect width="1200" height="630" fill="#0b1020"/>
<text x="60" y="90" font-size="40" font-weight="700" fill="#fff">Every second counts</text>
<text x="60" y="130" font-size="22" fill="#9fb0d0">Estimated conversion uplift per second saved (~7%, no guarantee)</text>
<g transform="translate(90,170)">
<line x1="0" y1="360" x2="1020" y2="360" stroke="#33405f"/>
<g fill="#ffc400">
<rect x="40" y="0" width="140" height="360" rx="8" fill="#33405f"/>
<rect x="240" y="26" width="140" height="334" rx="8" fill="#4a6fb5"/>
<rect x="440" y="50" width="140" height="310" rx="8" fill="#4a6fb5"/>
<rect x="640" y="73" width="140" height="287" rx="8" fill="#4a6fb5"/>
<rect x="840" y="95" width="140" height="265" rx="8" fill="#ffc400"/></g>
<g fill="#fff" font-size="24" text-anchor="middle" font-weight="700">
<text x="110" y="395">5 s</text><text x="310" y="395">4 s</text><text x="510" y="395">3 s</text><text x="710" y="395">2 s</text><text x="910" y="395">1 s</text>
<text x="110" y="-8" fill="#9fb0d0" font-size="20">100%</text>
<text x="310" y="18" fill="#9fb0d0" font-size="20">+7%</text><text x="510" y="42" fill="#9fb0d0" font-size="20">+14%</text><text x="710" y="65" fill="#9fb0d0" font-size="20">+21%</text><text x="910" y="87" fill="#ffc400" font-size="20">+28%</text></g></g>
<text x="60" y="600" font-size="20" fill="#9fb0d0">Illustrative estimate based on FlashSites speed calculator. Bars show relative index.</text>
</svg>
