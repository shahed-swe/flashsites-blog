<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica,Arial,sans-serif">
<rect width="1200" height="630" fill="#0b1020"/>
<text x="60" y="90" font-size="40" font-weight="700" fill="#fff">Origin vs. edge delivery</text>
<g font-size="24" fill="#fff" text-anchor="middle">
<text x="600" y="160" fill="#9fb0d0" font-size="22">Without edge cache: every visit hits your server</text>
<rect x="80" y="190" width="200" height="90" rx="12" fill="#33405f"/><text x="180" y="243">Visitor</text>
<rect x="500" y="190" width="200" height="90" rx="12" fill="#33405f"/><text x="600" y="243">Edge</text>
<rect x="920" y="190" width="200" height="90" rx="12" fill="#a33"/><text x="1020" y="243">Your server</text>
<path d="M280 265H920" stroke="#e66" stroke-width="5" stroke-dasharray="14 10"/>
<text x="600" y="320" fill="#e88" font-size="22">slow, load-dependent</text>
<text x="600" y="400" fill="#ffc400" font-size="22">With FlashSites edge cache: pages served close to the visitor</text>
<rect x="80" y="430" width="200" height="90" rx="12" fill="#33405f"/><text x="180" y="483">Visitor</text>
<rect x="500" y="430" width="200" height="90" rx="12" fill="#ffc400"/><text x="600" y="483" fill="#0b1020" font-weight="700">Edge cache</text>
<rect x="920" y="430" width="200" height="90" rx="12" fill="#33405f" opacity=".5"/><text x="1020" y="483" opacity=".6">Your server</text>
<path d="M280 475H500" stroke="#ffc400" stroke-width="6"/>
<path d="M700 475H920" stroke="#556" stroke-width="3" stroke-dasharray="4 10"/>
<text x="390" y="560" fill="#ffc400" font-size="22">fast</text><text x="810" y="560" fill="#889" font-size="22">only on changes</text></g>
</svg>
