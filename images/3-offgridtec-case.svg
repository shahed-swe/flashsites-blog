<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica,Arial,sans-serif">
<rect width="1200" height="630" fill="#0b1020"/>
<text x="60" y="90" font-size="40" font-weight="700" fill="#fff">Offgridtec: before and after</text>
<text x="60" y="130" font-size="22" fill="#9fb0d0">Real results from a Shopware store</text>
<g font-size="26" fill="#fff">
<text x="60" y="215">PageSpeed</text>
<rect x="300" y="185" width="416" height="40" rx="6" fill="#a33"/><text x="732" y="215" font-size="22">45</text>
<rect x="300" y="235" width="860" height="40" rx="6" fill="#2fb36b"/><text x="1140" y="265" font-size="22" text-anchor="end" fill="#0b1020" font-weight="700">93</text>
<text x="60" y="360">LCP</text>
<rect x="300" y="330" width="860" height="40" rx="6" fill="#a33"/><text x="1140" y="360" font-size="22" text-anchor="end">4.8 s</text>
<rect x="300" y="380" width="197" height="40" rx="6" fill="#2fb36b"/><text x="515" y="410" font-size="22">1.1 s</text>
<text x="60" y="505">Page size</text>
<rect x="300" y="475" width="860" height="40" rx="6" fill="#a33"/>
<rect x="300" y="525" width="155" height="40" rx="6" fill="#2fb36b"/><text x="473" y="555" font-size="22">-82%</text>
</g>
<text x="60" y="610" font-size="18" fill="#9fb0d0">Red = before, green = after. JavaScript also down 62%. Source: FlashSites customer case.</text>
</svg>
